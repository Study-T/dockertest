version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: tracking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ns_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - tracking-network

  redis:
    image: redis:6-alpine
    container_name: tracking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - tracking-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking-api
    ports:
      - "8082:8082"
    volumes:
      - ./app/etc/app-docker.yaml:/etc/app/app.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tracking-network

volumes:
  postgres_data:
  redis_data:

networks:
  tracking-network:
    driver: bridge
